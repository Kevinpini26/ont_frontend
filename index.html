<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portail de gestion administrative de l'Office National du Tourisme (RDC) : dépôt de demande de stage, dépôt de courrier et suivi de dossier en ligne."
    />
    <title>Portail de gestion administrative — Office National du Tourisme RDC</title>

    <!-- Open Graph / réseaux sociaux — og:image et og:url en chemin relatif
         à la racine : à rendre absolus (https://<domaine réel>/...) une fois
         le nom de domaine de production connu, un aperçu de lien (WhatsApp,
         Facebook...) ne résout pas toujours une URL relative correctement. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Office National du Tourisme — RDC" />
    <meta property="og:title" content="Portail de gestion administrative — Office National du Tourisme RDC" />
    <meta
      property="og:description"
      content="Dépôt de demande de stage, dépôt de courrier et suivi de dossier en ligne auprès de l'Office National du Tourisme (RDC)."
    />
    <meta property="og:image" content="/kinshasa-fleuve-congo.jpg" />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="fr_CD" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applique la classe .dark avant le premier rendu React (évite un flash de
      // thème incorrect) — sauf sur le portail public, qui reste clair par
      // charte graphique quel que soit le thème choisi. Garder cette liste
      // synchronisée avec PUBLIC_LIGHT_PATHS dans src/shared/hooks/useThemeSync.js.
      // Lit la préférence choisie (voir src/shared/store/themeStore.js, persistée
      // par le middleware "persist" de Zustand sous la clé "ont-theme") ; à
      // défaut, retombe sur la préférence système, jamais sur "clair" par défaut.
      (function () {
        var portailPublic = ['/', '/a-propos', '/services', '/demande-de-stage', '/depot-courrier-externe', '/suivi-dossier'];
        if (portailPublic.indexOf(window.location.pathname) !== -1) return;

        var theme = 'system';
        try {
          var stocke = JSON.parse(localStorage.getItem('ont-theme'));
          if (stocke && stocke.state && stocke.state.theme) theme = stocke.state.theme;
        } catch (e) {}

        var sombre = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
