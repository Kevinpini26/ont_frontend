server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Repli SPA : toute route inconnue de nginx (ex. /circuit/reception,
    # gérée côté client par react-router) renvoie index.html plutôt qu'un
    # 404 nginx — c'est react-router qui décide ensuite quoi afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite (index-XXXXXXXX.js, etc.) : immuables par
    # construction, cache long sans risque de servir une version périmée
    # après déploiement (le nom de fichier change).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html lui-même ne doit jamais être mis en cache longuement : il
    # référence les noms de fichiers hashés du déploiement courant.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src : à adapter avec le domaine réel de l'API backend une
    # fois connu (voir le guide d'installation) — 'self' seul suffit tant
    # que frontend et API sont servis depuis le même domaine via reverse
    # proxy, sinon ajouter explicitement https://api.<domaine>.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
}
